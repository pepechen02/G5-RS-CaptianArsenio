<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Captain Arsenio 閱讀理解測驗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --cream:#F7F2E7;
    --paper:#FFFFFF;
    --ink:#2B2416;
    --ink-soft:#6B6150;
    --navy-deep:#2B3A55;
    --navy-leaf:#4F6B96;
    --navy-pale:#E3E9F2;
    --amber:#C9792E;
    --amber-pale:#F6E6D0;
    --gold:#D9A441;
    --gold-pale:#FBF0D8;
    --wrong:#B2483F;
    --wrong-pale:#F6E1DD;
    --border:#DCD2BA;
    --shadow: 0 6px 18px rgba(43,58,85,0.12);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --cream:#1C1A15; --paper:#262320; --ink:#EDE8DD; --ink-soft:#B8AE98;
      --navy-deep:#9AB1D6; --navy-leaf:#6E8BB8; --navy-pale:#232C3A;
      --amber:#E8A563; --amber-pale:#3A2E1E; --gold:#E8C476; --gold-pale:#352A17;
      --wrong:#E2897E; --wrong-pale:#3A2420; --border:#3E372A;
      --shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --cream:#1C1A15; --paper:#262320; --ink:#EDE8DD; --ink-soft:#B8AE98;
    --navy-deep:#9AB1D6; --navy-leaf:#6E8BB8; --navy-pale:#232C3A;
    --amber:#E8A563; --amber-pale:#3A2E1E; --gold:#E8C476; --gold-pale:#352A17;
    --wrong:#E2897E; --wrong-pale:#3A2420; --border:#3E372A;
    --shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family: Avenir Next, "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, serif;
    font-weight:700;
    margin:0 0 .3em 0;
    color:var(--navy-deep);
  }
  #app{ max-width:760px; margin:0 auto; padding: 28px 18px 60px; }
  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .topbar .mark{ font-size:34px; line-height:1; }
  .topbar h1{ font-size:21px; margin:0; }
  .topbar .sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }

  .hero{
    background: linear-gradient(160deg, var(--navy-pale) 0%, var(--cream) 70%);
    border:1px solid var(--border);
    border-radius: 22px 22px 8px 22px;
    padding:22px 22px 18px;
    margin-bottom:22px;
  }
  .hero p{ color:var(--ink-soft); font-size:14.5px; max-width:48ch; }
  .overall{
    margin-top:10px; display:inline-flex; gap:8px; align-items:baseline;
    background:var(--paper); border:1px solid var(--border); border-radius:999px;
    padding:6px 14px; font-size:13.5px;
  }
  .overall b{ color:var(--navy-deep); font-size:16px;}

  .part-heading{ margin: 26px 0 10px; display:flex; align-items:baseline; gap:10px; }
  .part-heading .tag{
    font-size:11.5px; letter-spacing:.02em; background:var(--gold-pale); color:#8A5F13;
    border-radius:6px; padding:2px 8px;
  }
  :root[data-theme="dark"] .part-heading .tag{ color: var(--gold); background: var(--gold-pale); }
  .module-grid{ display:flex; flex-direction:column; gap:14px; }
  .module-card{
    text-align:left; background:var(--paper); border:1px solid var(--border);
    border-radius: 16px; padding:16px 16px 14px; cursor:pointer;
    box-shadow:var(--shadow); transition: transform .15s ease;
    font-family:inherit; color:var(--ink); display:flex; gap:14px; align-items:center;
  }
  .module-card:hover{ transform: translateY(-2px); }
  .module-card .icon{ font-size:30px; flex:0 0 auto; }
  .module-card .body{ flex:1; min-width:0; }
  .module-card h3{ font-size:16px; margin:0 0 2px; }
  .module-card .desc{ font-size:12.5px; color:var(--ink-soft); }
  .progress-bar-mini{ height:6px; border-radius:4px; background:var(--navy-pale); overflow:hidden; margin-top:8px; }
  .progress-bar-mini > div{ height:100%; background:var(--navy-leaf); }
  .status{ margin-top:8px; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; }
  .badge-score{ font-weight:700; color:var(--navy-deep); }

  .quiz-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .back-link{ background:none;border:none;color:var(--navy-deep); font-size:13.5px; cursor:pointer; padding:4px 0; font-family:inherit; }
  .progress-track{ flex:1; height:8px; border-radius:6px; background:var(--navy-pale); margin:0 12px; overflow:hidden; }
  .progress-track > div{ height:100%; background:var(--navy-leaf); transition:width .25s ease; }
  .qcount{ font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}

  .card{ background:var(--paper); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:var(--shadow); }
  .prompt{ font-size:16.5px; font-weight:600; margin-bottom:14px; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .option-btn{
    text-align:left; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-size:14.5px; color:var(--ink); cursor:pointer;
    font-family:inherit; display:flex; gap:10px; align-items:flex-start;
  }
  .option-btn .letter{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft);
  }
  .option-btn:hover{ border-color:var(--navy-leaf); }
  .option-btn.correct{ border-color:var(--navy-leaf); background:var(--navy-pale); }
  .option-btn.correct .letter{ background:var(--navy-leaf); border-color:var(--navy-leaf); color:#fff;}
  .option-btn.wrong{ border-color:var(--wrong); background:var(--wrong-pale); }
  .option-btn.wrong .letter{ background:var(--wrong); border-color:var(--wrong); color:#fff;}
  .option-btn.disabled{ cursor:default; }
  .option-btn.dim{ opacity:.55; }

  .feedback{ margin-top:14px; padding:12px 14px; border-radius:12px; font-size:13.5px; }
  .feedback.correct{ background:var(--navy-pale); color:var(--navy-deep); }
  .feedback.wrong{ background:var(--wrong-pale); color:var(--wrong); }
  .feedback .verdict{ font-weight:700; margin-bottom:6px; }
  .feedback .explain-en{ color:var(--ink); opacity:.85; font-style:italic; margin-bottom:6px; }
  .feedback .explain-zh{ color:var(--ink); opacity:.95; }

  .nav-row{ display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .btn{
    font-family:inherit; border-radius:12px; padding:10px 16px; font-size:14px; cursor:pointer;
    border:1.5px solid var(--border); background:var(--paper); color:var(--ink);
  }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--navy-deep); border-color:var(--navy-deep); color:#fff; }
  .btn.primary:disabled{ background:var(--navy-leaf); border-color:var(--navy-leaf); opacity:.45;}

  .score-banner{ text-align:center; background:var(--navy-pale); border-radius:18px; padding:22px; margin-bottom:18px; }
  .score-banner .big{ font-size:40px; font-weight:700; color:var(--navy-deep); font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; }
  .score-banner .pct{ color:var(--ink-soft); font-size:13.5px; margin-top:4px;}

  .qlist{ display:flex; flex-direction:column; gap:8px; }
  .qrow{
    display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; cursor:pointer; font-family:inherit; font-size:13.5px;
    color:var(--ink); text-align:left;
  }
  .qrow .num{
    flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; background:var(--navy-pale); color:var(--navy-deep);
  }
  .qrow.wrong .num{ background:var(--wrong-pale); color:var(--wrong); }
  .qrow .qtext{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qrow .icon{ flex:0 0 auto; font-size:14px; }

  .summary-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  footer.note{ text-align:center; color:var(--ink-soft); font-size:12px; margin-top:34px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var MODULES = {
    G1: { title:"測驗一", desc:"Motocanary 金絲雀動力機實驗", icon:"🕊️" },
    G2: { title:"測驗二", desc:"故事背景、角色與主題", icon:"✈️" },
    G3: { title:"測驗三", desc:"深入理解與詞彙推論", icon:"📖" },
    V1: { title:"單字 W4", desc:"impulse ~ circumstances", icon:"📝" },
    V2: { title:"單字 W5", desc:"automatic ~ illogical", icon:"🔤" },
    V3: { title:"單字 W6", desc:"high ~ go", icon:"✏️" },
    V4: { title:"單字 W7", desc:"eloped ~ lotion", icon:"🖊️" }
  };
  var MODULE_ORDER = ["G1","G2","G3","V1","V2","V3","V4"];
  var MODULE_GROUPS = [
    { label:"閱讀理解 Reading Comprehension", tag:"READING", modules:["G1","G2","G3"] },
    { label:"單字 Vocabulary", tag:"VOCAB", modules:["V1","V2","V3","V4"] }
  ];

  var Q = {};

  Q.G1 = [
    {q:"What does Captain Arsenio's description of the Motocanary experiment tell you about him?",
     opts:["He is determined.","He is odd.","He doesn't know what he is doing.","He gives up easily."],
     a:1,
     exEn:"Captain Arsenio's detailed plan to train canaries to power a flying machine by pecking at seeds shows he has quite odd and unusual ideas that make him a rather eccentric character.",
     exZh:"阿森尼奧船長訓練金絲雀啄食種子來驅動飛行機器的詳細計畫，顯示出他有相當古怪、不尋常的想法，使他成為一個頗為怪異（eccentric）的角色。"},
    {q:"Why do you think the author chose to include diary entries with illustrations to show each step of the Motocanary experiment?",
     opts:["To give a visual of the experiment.","To show how silly Captain Arsenio looks.","To explain the process.","To persuade the reader to try the experiment."],
     a:0,
     exEn:"The author included diary entries with illustrations to give a visual of the experiment because seeing drawings of each step helps readers better understand how Captain Arsenio put together and tested his Motocanary invention.",
     exZh:"作者加入附插圖的日記內容，是為了讓讀者能「看見」這個實驗的畫面──透過每個步驟的插圖，讀者能更清楚理解阿森尼奧船長是如何組裝並測試他的「金絲雀動力機」發明的。"},
    {q:"What lessons does Captain Arsenio learn during the experiment with the Motocanary?",
     opts:["He loves birds.","He cannot fail.","He is a genius.","He needs better equipment."],
     a:3,
     exEn:"During his experiment with the Motocanary, Captain Arsenio realizes that his equipment is inadequate when things don't go as planned, teaching him that he needs better equipment to successfully achieve his flying goals.",
     exZh:"在金絲雀動力機的實驗中，當事情不如預期發展時，阿森尼奧船長意識到自己的設備不足，這讓他學到：想要成功達成飛行的目標，他需要更好的設備。"},
    {q:"Based on how he approaches his projects, what is one of Captain Arsenio's character traits?",
     opts:["lazy","energetic","persistent","productive"],
     a:2,
     exEn:"Throughout the story, Captain Arsenio never gives up on his flying machine projects despite repeated failures, showing that he is truly persistent in pursuing his goals.",
     exZh:"在整個故事中，儘管一再失敗，阿森尼奧船長從未放棄他的飛行機器計畫，這顯示出他在追求目標時真正具有「堅持不懈（persistent）」的特質。"},
    {q:"What can we learn about Captain Arsenio from his flight diary?",
     opts:["He is eccentric.","He is confident.","He is unintelligent.","He is irresponsible."],
     a:1,
     exEn:"Based on Captain Arsenio's flight diary entries, we can tell he is confident because he continues attempting bold flying experiments and documenting them, even when they don't work out perfectly.",
     exZh:"從阿森尼奧船長的飛行日記內容可以看出，他是個有自信（confident）的人，因為即使實驗並未完美成功，他仍持續嘗試大膽的飛行實驗，並將過程記錄下來。"},
    {q:"What does the phrase \u201cObvious results\u201d in paragraph 13 suggest about the narrator's point of view?",
     opts:["The narrator thinks Captain Arsenio is a hard worker.","The narrator feels sorry for Captain Arsenio.","The narrator thinks Captain Arsenio did not think about his all parts of his invention.","The narrator is frustrated with Captain Arsenio."],
     a:2,
     exEn:"When the narrator says \u201cObvious results\u201d, they are implying that anyone could have predicted the crash, suggesting that Captain Arsenio did not think through all parts of his invention carefully before testing it.",
     exZh:"當敘述者說出「顯而易見的結果（Obvious results）」時，暗示著任何人都能預料到這次墜毀的結果，這表示阿森尼奧船長在測試之前，並沒有把發明的每個部分都仔細思考清楚。"},
    {q:"What does Captain Arsenio's third failure confirm about him?",
     opts:["That he is not good at inventions.","That he is determined.","That he is close to getting his flying invention correct.","That he has given up."],
     a:1,
     exEn:"Despite failing twice before, Captain Arsenio tries a third time to make his flying invention work, which shows he is determined to achieve his goal and won't give up easily.",
     exZh:"儘管先前已經失敗了兩次，阿森尼奧船長仍然第三次嘗試讓他的飛行發明成功運作，這顯示出他對達成目標相當堅定（determined），不會輕易放棄。"},
    {q:"How do the diary images help make the story more entertaining?",
     opts:["They give the reader directions.","They give the reader visuals to see what is happening.","They make the reader laugh.","They make the reader want to try an invention."],
     a:1,
     exEn:"In Captain Arsenio's story, the diary images act like a visual guide that helps readers better picture and understand what's happening in the story by showing visuals of events, characters, and inventions rather than just describing them with words.",
     exZh:"在阿森尼奧船長的故事裡，日記中的插圖就像一份視覺指南，透過直接呈現事件、角色與發明的畫面（而不只是用文字描述），幫助讀者更容易想像並理解故事中發生的事情。"},
    {q:"The main problem in the story is...",
     opts:["Captain Arsenio gets stuck in a tree.","Captain Arsenio gives up.","Captain Arsenio's inventions are not working.","the birds caused a lot of problems."],
     a:2,
     exEn:"Throughout the story, we see that the main conflict centers around Captain Arsenio's inventions not working as planned, which leads to his various flying attempts failing and creates the central challenge he needs to overcome.",
     exZh:"整個故事中，主要的衝突都圍繞在阿森尼奧船長的發明無法如預期運作，這導致他多次飛行嘗試失敗，也形成了他必須克服的核心難題。"},
    {q:"What is the resolution in the story?",
     opts:["There is no resolution.","Captain Arsenio's invention worked.","Captain Arsenio learns from his mistakes.","Captain Arsenio discovers he is not an inventor."],
     a:2,
     exEn:"The resolution shows how Captain Arsenio learns from his mistakes after his failed attempts at flying, demonstrating growth in his character rather than giving up on his dreams completely.",
     exZh:"故事的結局呈現出阿森尼奧船長在多次飛行失敗後，從自己的錯誤中學習成長──這展現出他角色上的成長，而不是完全放棄自己的夢想。"},
    {q:"Which of the following is NOT the setting of the story?",
     opts:["1700s","Outside","The future"],
     a:2,
     exEn:"The story of Captain Arsenio takes place in the 1700s and is set outdoors, but the future is not one of the settings since it's a historical tale rather than a futuristic one.",
     exZh:"阿森尼奧船長的故事發生在 1700 年代，場景多設定在戶外，但「未來」並不是這個故事的場景之一，因為這是一個歷史故事，而非未來科幻故事。"}
  ];

  Q.G2 = [
    {q:"What is the genre of Captain Arsenio?",
     opts:["Non-fiction","Science-Fiction","Folktale","Fantasy"],
     a:3,
     exEn:"This story belongs to the fantasy genre, following an eccentric captain who carries out a series of wildly imaginative flying experiments.",
     exZh:"這部作品屬於奇幻文學（Fantasy），講述了一位古怪（eccentric）的船長進行各種異想天開飛行實驗的故事。"},
    {q:"Captain Arsenio was very successful in all his other jobs. (cheese master, blacksmith, scuba instructor, ship captain)",
     opts:["True","False"],
     a:1,
     exEn:"Captain Arsenio was actually not successful in his other jobs like cheese master, blacksmith, and scuba instructor, which is what led him to try being a ship captain!",
     exZh:"事實上，阿森尼奧船長在起司師傅、鐵匠、潛水教練等其他工作上都不太成功，這也是他後來嘗試成為船長的原因！"},
    {q:"How do we know about Captain Arsenio?",
     opts:["His diary was found years ago.","He was in the newspaper.","People learned about him from TV.","He was famous for being a scuba diver."],
     a:0,
     exEn:"We know about Captain Arsenio because his diary was found years ago, which provided historians with a first-hand account of his life and adventures.",
     exZh:"我們之所以認識阿森尼奧船長，是因為他的日記在多年後被人發現，這份日記為歷史學家提供了關於他生平與冒險經歷的第一手資料。"},
    {q:"What did Captain Arsenio use in his first invention?",
     opts:["cheese","canaries","springs","a rocket"],
     a:1,
     exEn:"In his first invention, the Motocanary, Captain Arsenio used canaries to power the flying machine by having them peck at seeds.",
     exZh:"在他的第一個發明「金絲雀動力機（Motocanary）」中，他使用了金絲雀（canaries）啄食種子來提供動力。"},
    {q:"Captain Arsenio's second flight invention relied heavily on...",
     opts:["temperature","bounce","acceleration","weight"],
     a:2,
     exEn:"Captain Arsenio's second flying invention depended heavily on acceleration, requiring enough running speed to build up before the machine could attempt to lift off.",
     exZh:"他的第二個飛行發明高度依賴「加速（acceleration）」，需要先累積足夠的奔跑速度，機器才能嘗試離地升空。"},
    {q:"In his 3rd flight invention, what part did Captain Arsenio forget?",
     opts:["How to make it bounce","How to make it fast","How to keep it in the air","How to use a spring"],
     a:2,
     exEn:"In his third flying invention, Captain Arsenio forgot to figure out how to keep the machine in the air once it had lifted off, which is why it ultimately failed.",
     exZh:"在他的第三個飛行發明中，他忘記思考「如何讓機器保持在空中（How to keep it in the air）」，這也是這項發明最終失敗的原因。"},
    {q:"What can you infer from step 7 on pg. 71?",
     opts:["Captain Arsenio had a sick animal.","Captain Arsenio was unharmed.","Captain Arsenio was dead.","Captain Arsenio was injured."],
     a:3,
     exEn:"From step 7 on page 71, we can infer that Captain Arsenio was injured during his experiment, based on the details and illustrations describing what happened to him.",
     exZh:"從第 71 頁第 7 步驟的描述與插圖可以推斷出，阿森尼奧船長在這次實驗中受傷了（injured）。"},
    {q:"Why do some believe Captain Arsenio was successful in building his flight machine?",
     opts:["His diary was found in Egypt.","His diary was found at the bottom of the sea.","His diary was found on the surface of the moon.","All of the above."],
     a:1,
     exEn:"Some believe Captain Arsenio succeeded because his diary was found at the bottom of the sea \u2014 suggesting he may have flown out over open water before it was lost, which some readers take as a sign that his final invention actually got off the ground.",
     exZh:"有些人認為阿森尼奧船長最終成功了，是因為他的日記是在海底被發現的──這暗示他可能曾飛越海面，之後日記才沉落海中，部分讀者將此視為他的最後一項發明確實成功升空的證據。"},
    {q:"What is the theme of this story?",
     opts:["You have to be eccentric to invent something.","Never try too many new things.","Failing is sometimes the first step to success.","Flying is the most important thing in life."],
     a:2,
     exEn:"The central theme of the story is that failing is sometimes the first step to success \u2014 Captain Arsenio's repeated failures are part of the process that eventually moves him closer to achieving his goal.",
     exZh:"故事的核心主題在於「失敗有時是邁向成功的第一步」──阿森尼奧船長一再的失敗，正是讓他逐漸邁向目標的過程中不可或缺的一部分。"},
    {q:"Literary elements include:",
     opts:["Characters","Setting","Events","All of the above"],
     a:3,
     exEn:"Literary elements are the building blocks that make up any story \u2014 this includes characters (who's in the story), setting (where and when it happens), and events (what takes place), which all work together to create a complete narrative.",
     exZh:"文學要素是構成一個故事的基本元素，包括角色（故事裡有誰）、場景（故事發生的時間與地點），以及事件（故事中發生了什麼事）──這些要素共同組合，才能構成一個完整的故事。"}
  ];

  Q.G3 = [
    {q:"What is the main idea of the section titled \u201cThe End and the Beginning\u201d?",
     opts:["Captain Arsenio always had easy jobs.","Captain Arsenio was bad at everything he tried.","Captain Arsenio had jobs most people would have enjoyed doing.","Captain Arsenio was not interested in most of the things he had tried."],

  var STORAGE_KEY = "arsenio_quiz_v1";
  function loadState(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return {};
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){} }
  var progress = loadState();
  MODULE_ORDER.forEach(function(m){
    if(!progress[m] || progress[m].length !== Q[m].length){
      progress[m] = Q[m].map(function(){ return {sel:null, correct:null}; });
    }
  });

  var view = "home";
  var curModule = null;
  var curIndex = 0;
  var summaryFrom = false;

  var appEl = document.getElementById("app");

  function moduleScore(m){
    var arr = progress[m];
    var answered = arr.filter(function(r){ return r.sel !== null; }).length;
    var correct = arr.filter(function(r){ return r.correct === true; }).length;
    return { answered: answered, correct: correct, total: arr.length };
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  function renderHome(){
    var totalCorrect = 0, totalAnswered = 0, totalAll = 0, allDone = true;
    MODULE_ORDER.forEach(function(m){
      var s = moduleScore(m);
      totalCorrect += s.correct; totalAnswered += s.answered; totalAll += s.total;
      if(s.answered < s.total) allDone = false;
    });
    var overallHtml = "";
    if(totalAnswered > 0){
      overallHtml = '<div class="overall">已作答 <b>' + totalAnswered + '</b> / ' + totalAll + ' 題' +
        (allDone ? '\u3000\u00b7\u3000總分 <b>' + totalCorrect + '</b> / ' + totalAll : '') + '</div>';
    }
    function cardFor(m){
      var meta = MODULES[m];
      var s = moduleScore(m);
      var pct = s.total ? Math.round((s.answered/s.total)*100) : 0;
      var statusText = s.answered === 0 ? "尚未開始" :
        (s.answered < s.total ? ("進行中 " + s.answered + "/" + s.total) : ("完成 \u00b7 " + s.correct + "/" + s.total + " 分"));
      return '' +
      '<button class="module-card" data-module="' + m + '">' +
        '<div class="icon">' + meta.icon + '</div>' +
        '<div class="body">' +
          '<h3>' + esc(meta.title) + '</h3>' +
          '<div class="desc">' + esc(meta.desc) + '（' + s.total + ' 題）</div>' +
          '<div class="progress-bar-mini"><div style="width:' + pct + '%"></div></div>' +
          '<div class="status"><span>' + esc(statusText) + '</span>' +
            (s.answered === s.total && s.total>0 ? '<span class="badge-score">' + s.correct + '/' + s.total + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</button>';
    }
    var sectionsHtml = MODULE_GROUPS.map(function(g){
      return '<div class="part-heading"><span class="tag">' + esc(g.tag) + '</span><h2 style="font-size:16px;margin:0;">' + esc(g.label) + '</h2></div>' +
        '<div class="module-grid">' + g.modules.map(cardFor).join("") + '</div>';
    }).join("");

    appEl.innerHTML =
      '<div class="topbar"><div class="mark">\u2708\ufe0f</div><div>' +
        '<h1>Captain Arsenio</h1>' +
        '<div class="sub">閱讀理解互動測驗</div>' +
      '</div></div>' +
      '<div class="hero">' +
        '<h2 style="font-size:17px;margin-bottom:6px;">選一組測驗開始作答</h2>' +
        '<p>每組約 10 題，答完立刻顯示對錯，並附中英雙語解析。可以分批完成，進度會自動保留。</p>' +
        overallHtml +
      '</div>' +
      sectionsHtml +
      '<footer class="note">根據提供的 Captain Arsenio 閱讀測驗與單字題庫整理製作，僅供學習使用。</footer>';

    Array.prototype.forEach.call(appEl.querySelectorAll(".module-card"), function(btn){
      btn.addEventListener("click", function(){
        curModule = btn.getAttribute("data-module");
        var arr = progress[curModule];
        var firstUnanswered = arr.findIndex(function(r){ return r.sel === null; });
        if(firstUnanswered === -1){ view = "summary"; }
        else { curIndex = firstUnanswered; view = "quiz"; }
        render();
      });
    });
  }

  function renderQuiz(){
    var list = Q[curModule];
    var item = list[curIndex];
    var rec = progress[curModule][curIndex];
    var answered = rec.sel !== null;
    var total = list.length;
    var pct = Math.round(((curIndex+1)/total)*100);

    var optionsHtml = item.opts.map(function(opt, idx){
      var cls = "option-btn";
      if(answered){
        cls += " disabled";
        if(idx === item.a) cls += " correct";
        else if(idx === rec.sel) cls += " wrong";
        else cls += " dim";
      }
      var letter = String.fromCharCode(65+idx);
      return '<button class="' + cls + '" data-idx="' + idx + '">' +
        '<span class="letter">' + letter + '</span><span>' + esc(opt) + '</span>' +
      '</button>';
    }).join("");

    var feedbackHtml = "";
    if(answered){
      var isCorrect = rec.correct;
      feedbackHtml = '<div class="feedback ' + (isCorrect ? "correct" : "wrong") + '">' +
        '<div class="verdict">' + (isCorrect ? "\u2705 答對了！" : "\u274c 答錯了，正確答案是「" + esc(item.opts[item.a]) + "」") + '</div>' +
        '<div class="explain-en">' + esc(item.exEn) + '</div>' +
        '<div class="explain-zh">' + esc(item.exZh) + '</div>' +
      '</div>';
    }

    var isLast = curIndex === total - 1;
    var nextLabel = summaryFrom ? "返回總覽" : (isLast ? "完成本組 \u2192" : "下一題 \u2192");

    appEl.innerHTML =
      '<div class="quiz-header">' +
        '<button class="back-link" id="btnBack">\u2190 ' + (summaryFrom ? "返回總覽" : "回首頁") + '</button>' +
        '<div class="progress-track"><div style="width:' + pct + '%"></div></div>' +
        '<div class="qcount">第 ' + (curIndex+1) + ' / ' + total + ' 題</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="prompt">' + esc(item.q) + '</div>' +
        '<div class="options">' + optionsHtml + '</div>' +
        feedbackHtml +
      '</div>' +
      '<div class="nav-row">' +
        '<button class="btn" id="btnPrev" ' + (curIndex===0 ? "disabled" : "") + '>\u2190 上一題</button>' +
        '<button class="btn primary" id="btnNext" ' + (!answered ? "disabled" : "") + '>' + nextLabel + '</button>' +
      '</div>';

    appEl.querySelector("#btnBack").addEventListener("click", function(){
      view = summaryFrom ? "summary" : "home";
      summaryFrom = false;
      render();
    });
    appEl.querySelector("#btnPrev").addEventListener("click", function(){
      if(curIndex > 0){ curIndex -= 1; render(); }
    });
    appEl.querySelector("#btnNext").addEventListener("click", function(){
      if(summaryFrom){ view = "summary"; summaryFrom = false; render(); return; }
      if(isLast){ view = "summary"; render(); return; }
      curIndex += 1; render();
    });

    if(!answered){
      Array.prototype.forEach.call(appEl.querySelectorAll(".option-btn"), function(btn){
        btn.addEventListener("click", function(){
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          rec.sel = idx;
          rec.correct = (idx === item.a);
          saveState();
          render();
        });
      });
    }
  }

  function renderSummary(){
    var list = Q[curModule];
    var arr = progress[curModule];
    var correct = arr.filter(function(r){ return r.correct === true; }).length;
    var total = list.length;
    var pct = Math.round((correct/total)*100);

    var rowsHtml = list.map(function(item, idx){
      var rec = arr[idx];
      var isWrong = rec.sel !== null && !rec.correct;
      var isUnanswered = rec.sel === null;
      var icon = isUnanswered ? "\u2b1c" : (rec.correct ? "\u2705" : "\u274c");
      return '<button class="qrow ' + (isWrong ? "wrong" : "") + '" data-idx="' + idx + '">' +
        '<span class="num">' + (idx+1) + '</span>' +
        '<span class="qtext">' + esc(item.q) + '</span>' +
        '<span class="icon">' + icon + '</span>' +
      '</button>';
    }).join("");

    appEl.innerHTML =
      '<div class="quiz-header">' +
        '<button class="back-link" id="btnBack">\u2190 回首頁</button>' +
        '<div class="qcount">' + esc(MODULES[curModule].title) + '</div>' +
      '</div>' +
      '<div class="score-banner">' +
        '<div class="big">' + correct + ' / ' + total + '</div>' +
        '<div class="pct">答對率 ' + pct + '%</div>' +
      '</div>' +
      '<div class="qlist">' + rowsHtml + '</div>' +
      '<div class="summary-actions">' +
        '<button class="btn" id="btnRetake">\ud83d\udd04 重新測驗這一組</button>' +
        '<button class="btn primary" id="btnHome2">回首頁</button>' +
      '</div>';

    appEl.querySelector("#btnBack").addEventListener("click", function(){ view="home"; render(); });
    appEl.querySelector("#btnHome2").addEventListener("click", function(){ view="home"; render(); });
    appEl.querySelector("#btnRetake").addEventListener("click", function(){
      progress[curModule] = Q[curModule].map(function(){ return {sel:null, correct:null}; });
      saveState();
      curIndex = 0;
      summaryFrom = false;
      view = "quiz";
      render();
    });
    Array.prototype.forEach.call(appEl.querySelectorAll(".qrow"), function(btn){
      btn.addEventListener("click", function(){
        curIndex = parseInt(btn.getAttribute("data-idx"), 10);
        summaryFrom = true;
        view = "quiz";
        render();
      });
    });
  }

  function render(){
    window.scrollTo(0,0);
    if(view === "home") renderHome();
    else if(view === "quiz") renderQuiz();
    else if(view === "summary") renderSummary();
  }

  render();
})();
</script>
</body>
</html>
